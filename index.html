<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://clairku.github.io/clair-ai-studio/" />
    <link rel="canonical" href="https://clairku.github.io/clair-ai-studio/" />
    <title>正在前往 Clair AI Studio</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #f6f5f2;
        color: #18202a;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      main {
        width: min(460px, 100%);
        border: 1px solid #dedfdf;
        border-radius: 20px;
        background: #fff;
        padding: 34px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 22px; color: #68717c; font-size: 13px; line-height: 1.7; }
      a {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        border-radius: 999px;
        background: #18202a;
        padding: 0 18px;
        color: #fff;
        font-size: 13px;
        font-weight: 680;
        text-decoration: none;
      }
    </style>
    <script>
      (() => {
        const target = new URL("https://clairku.github.io/clair-ai-studio/");
        const params = new URLSearchParams(window.location.search);
        params.delete("release");
        target.search = params.toString();
        target.hash = window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>工作台已升级</h1>
      <p>正在前往 Clair AI Studio。旧收藏仍然有效，无需重新查找报告。</p>
      <a href="https://clairku.github.io/clair-ai-studio/">立即进入新版</a>
    </main>
  </body>
</html>
